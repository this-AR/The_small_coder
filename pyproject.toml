[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smallcoder"
version = "0.1.0"
description = "System-One controller, repair and phone deployment for a small competitive-programming coder"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "datasets>=3.0",
  "huggingface_hub>=0.24",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
gpu = ["torch>=2.4", "transformers>=4.46", "vllm>=0.6"]
train = ["torch>=2.4", "transformers>=4.46", "trl>=0.14", "accelerate>=1.0"]
rag = ["rank_bm25>=0.2.2", "sentence-transformers>=3.0"]
phone = ["llama-cpp-python>=0.3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["smallcoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
